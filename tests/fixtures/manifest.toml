[[fixture]]
name = "ShadowedFields"
source = "java/ShadowedFields/src.java"
expected_stdout = "java/ShadowedFields/expected.txt"
status = "compile_fail"
notes = "R8 batch-1: B extends A with both declaring a field named `obj`. Field shadowing keeps both fields physically. Decompile must preserve `((B) super.obj).message` exactly. **Recompile fails**: B's no-args ctor `B()` calls `this(null)` — i.e. delegates to `B(String)` which then calls `super()` (A's default ctor, no args). Decompiler instead emits `super(null)` directly in B(), which references A's nonexistent `(String)` ctor. The this-vs-super invocation distinction is the discriminator (DEX has no separate opcode — both lower to `invoke-direct` on `<init>` of the appropriate class; the type of the receiver `this` register at the call site is the cue). Candidate follow-up: `dex-decompile-this-vs-super-ctor-call` — when an `<init>` body's first instruction is `invoke-direct` on `<init>` of the SAME class, emit `this(...)`; if it targets the IMMEDIATE SUPER class, emit `super(...)`."

[[fixture]]
name = "PrivateMethodCollision"
source = "java/PrivateMethodCollision/src.java"
expected_stdout = "java/PrivateMethodCollision/expected.txt"
status = "compile_pass"
notes = "R8 batch-1: private `m()` declared on both A and `B extends A` — unrelated symbols (no override). `A.invokeM()` calls private m() which resolves at compile time to A.m. Separately, `D extends C` with public override + super.m(). Graduated by `dex-decompile-invoke-opcode-preservation` 2026-04-26 via `InvokeKind` enum (defect family B). Audit found the load-bearing hang was D.m's `invoke-super` collapse (NOT A.invokeM's invoke-direct, which already rendered as JLS-correct `this.m()`). Fix lowers `invoke-super` on `this` to `super.m(args)`, plus a bonus discriminator for `invoke-direct + same-class` → bare `m(args)` (cleaner than `this.m()`; opcode-discriminator-only, no method-access-flags lookup since javac/d8 only emits invoke-direct for private targets in non-`<init>` cases)."

