# Language-coverage fixture matrix for droidsaw-dex, tier-1 consumer of
# droidsaw-fixture-harness. Each entry drives the pipeline:
#   javac(src.java) → d8 → droidsaw_dex::decompile_class → javac → java.
# The fixture passes if both the original java run and the decompiled-then-
# recompiled java run match expected.txt verbatim.
#
# status = "compile_pass" — baseline: all stages complete, diff-clean against
#                          expected.txt.
# status = "compile_fail" — baseline: some stage returns a typed error
#                          (javac/d8/decompile/recompile/java).
# SemanticFail / ResourceLimitExceeded are outcome-only; check_ratchet
# always flags them as regressions, and Manifest::load rejects them here.

